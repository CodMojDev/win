<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta charset="utf-8" />
    <title>Leaflet 0.4.5</title>
    <style>/* [MAP CONTROL] PLACEHOLDER - STYLESHEET */</style>
    <script>/* [MAP CONTROL] PLACEHOLDER - SCRIPT */</script>
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        /* [MAP CONTROL] PLACEHOLDER - JSON POLYFILL (IE6) */
        L.Icon.Default.imagePath = '[MAP CONTROL] PLACEHOLDER - ICON PATH';
        function createXHR() {
            if (typeof XMLHttpRequest !== 'undefined') {
                return new XMLHttpRequest();
            }
            var versions = [
                "MSXML2.XMLHTTP.6.0",
                "MSXML2.XMLHTTP.3.0",
                "Microsoft.XMLHTTP"
            ];
            var xhr;
            for (var i = 0; i < versions.length; i++) {
                try {
                xhr = new ActiveXObject(versions[i]);
                return xhr;
                } catch (e) {}
            }
            return null; 
        }
        var map = new L.Map('map').setView([0.0, 0.0], 2);
        function locateByGeoIP()
        {
            var xhr = createXHR();
            xhr.onreadystatechange = function() {
                if (xhr.readyState == 4 && xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    map.setView([data.lat, data.lon], 10);
                }
            };
            try {
                xhr.open('GET', 'http://ip-api.com/json/?fields=lat,lon', true);
                xhr.send();
            } catch (e) {
                try {
                    xhr.open('GET', 'https://ip-api.com/json/?fields=lat,lon', true);
                    xhr.send();
                } catch (e) {}
            }
        }
        function initMap()
        {
            new L.TileLayer('[MAP CONTROL] PLACEHOLDER - TILE URL', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);
        }
        initMap();
    </script>
</body>
</html>
